name: self-audit

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python3 test_toolfence.py

  audit-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # toolfence 审计自己。它自己的 MCP server 必须始终零发现。
      - uses: ./
        with:
          fail-on: low
